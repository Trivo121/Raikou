[Service]
# For the g4dn (T4) box. The T4's 15 GB is shared by vLLM and the GPU worker, so
# the API process embeds search queries on the CPU instead of loading a second
# copy of SARCLIP onto the GPU. Only the API gets this: the GPU worker keeps the
# default device. Install as
# /etc/systemd/system/sar-backend.service.d/20-sarclip-cpu.conf.
Environment=SARCLIP_DEVICE=cpu
